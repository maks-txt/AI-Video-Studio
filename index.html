<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stikman AI Pro — Генератор Сюжетов и Миров</title>
    <style>
        :root {
            --bg: #070913;
            --panel: #0f172a;
            --accent: #a78bfa;
            --accent-hover: #7c5ce7;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
            --success: #6ed6a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 16px; max-width: 800px; margin: 0 auto; gap: 16px; }
        header { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); }
        h1 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .badge { font-size: 0.75rem; color: var(--accent); background: rgba(167,139,250,0.15); padding: 4px 10px; border-radius: 6px; font-weight: 600; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); }
        label { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
        input, textarea { background: #0b0f19; border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 0.95rem; width: 100%; outline: none; transition: border 0.2s; }
        input:focus, textarea:focus { border-color: var(--accent); }
        textarea { min-height: 90px; resize: vertical; line-height: 1.4; }
        .btn-group { display: flex; gap: 10px; }
        button.primary { background: linear-gradient(135deg, #b49aff, #7c5ce7); color: #171321; border: none; padding: 14px 20px; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button.primary:hover { opacity: 0.9; }
        button.secondary { background: var(--border); color: var(--text); border: 1px solid var(--border); padding: 12px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        button.secondary:hover { background: #334155; }
        .canvas-container { width: 100%; aspect-ratio: 9/16; max-height: 540px; background: #000; border-radius: 12px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); margin: 0 auto; }
        canvas { width: 100%; height: 100%; display: block; }
        .status-bar { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 4px; }
        .option-card { background: #141722; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; gap: 6px; }
        .option-card:hover { border-color: var(--accent); background: #1a1e2e; }
        .option-card.selected { border-color: var(--accent); background: #221d33; box-shadow: 0 0 15px rgba(167,139,250,0.2); }
        .option-card b { color: #d8b4fe; font-size: 0.95rem; }
        .option-card p { font-size: 0.83rem; color: var(--muted); line-height: 1.4; }
        .hidden { display: none !important; }
        .progress-bar-wrap { height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; margin-top: 4px; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #a78bfa, #6ed6a0); transition: width 0.1s linear; }
    </style>
</head>
<body>
    <header>
        <h1>🤖 Stikman AI Pro <span class="badge">Сценарии 30-60с & 5 Вариантов</span></h1>
    </header>

    <div class="card">
        <h3>1. Тема и подсказки для ИИ-сценариста</h3>
        <label for="topicInput">Тема ролика (например: Человек-Паук в ночном мегаполисе, киберпанк-погоня...):</label>
        <input type="text" id="topicInput" value="Человек-Паук спасает ночной мегаполис под дождем от дронов">

        <label for="hintsInput">Повороты сюжета / Подсказки (для ИИ):</label>
        <textarea id="hintsInput" placeholder="Например: герой на крыше, внезапная погоня, кульминационный прыжок через пропасть...">Герой на крыше небоскреба, внезапная атака дронов, акробатическая погоня и прыжок веры в финале</textarea>

        <button class="primary" onclick="generateStoryOptions()">✨ Сгенерировать 5 вариантов сюжета (30-60 сек)</button>
    </div>

    <div class="card hidden" id="optionsCard">
        <h3>2. Выберите один из 5 вариантов сюжета:</h3>
        <div class="options-grid" id="optionsGrid"></div>
        <button class="primary" onclick="confirmSelectedStory()" style="margin-top: 6px;">🎬 Утвердить сюжет и запустить рендер мира</button>
    </div>

    <div class="card">
        <h3>3. Кинематографичный мир, анимация и живая озвучка</h3>
        <div class="canvas-container">
            <canvas id="stikmanCanvas" width="720" height="1280"></canvas>
        </div>
        <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="status-bar">
            <span id="renderStatus">Статус: Введите тему и сгенерируйте сюжет</span>
            <span id="renderTimer">0.0с / 45.0с</span>
        </div>
        <div class="btn-group">
            <button class="primary" onclick="startPlayback()">▶ Смотреть со звуком и озвучкой</button>
            <button class="secondary" onclick="stopPlayback()">⏹ Стоп</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('stikmanCanvas');
        const ctx = canvas.getContext('2d');
        let animationId = null;
        let isPlaying = false;
        let startTime = 0;
        let selectedOptionIndex = 0;
        let currentStoryOptions = [];
        let activeVariant = null;

        function generateStoryOptions() {
            const topic = document.getElementById('topicInput').value.trim() || "Эпическое приключение героя";
            const hints = document.getElementById('hintsInput').value.trim();

            currentStoryOptions = [
                {
                    title: "Вариант 1: Завязка, погоня и кульминационный финал (45с)",
                    acts: [
                        { t: 0, sub: "Часть 1 (0-15с): Ночной мегаполис, завязка и появление героя на высоте." },
                        { t: 15, sub: "Часть 2 (15-30с): Внезапное нападение дронов и динамичный экшн-прорыв." },
                        { t: 30, sub: "Часть 3 (30-45с): Кульминационный прыжок через пропасть и победный финал." }
                    ],
                    desc: `Сценарий (45с): Полная сюжетная линия по теме «${topic}». ${hints}. Развитие идет непрерывно все 45 секунд без пауз.`
                },
                {
                    title: "Вариант 2: Драматическая история с внезапным поворотом (45с)",
                    acts: [
                        { t: 0, sub: "Часть 1 (0-15с): Одинокий силуэт под дождем и тревожный сигнал тревоги." },
                        { t: 15, sub: "Часть 2 (15-30с): Схватка с превосходящими силами противника и погоня." },
                        { t: 30, sub: "Часть 3 (30-45с): Неожиданный поворот сюжета и триумфальное спасение." }
                    ],
                    desc: `Сценарий (45с): Драматический блокбастер на тему «${topic}». ${hints}. События нарастают каждую секунду.`
                },
                {
                    title: "Вариант 3: Киберпанк-триллер с неоновым экшном (45с)",
                    acts: [
                        { t: 0, sub: "Часть 1 (0-15с): Неоновые крыши и старт опасной миссии." },
                        { t: 15, sub: "Часть 2 (15-30с): Скоростная погоня под кибер-дождем и уклонение от атак." },
                        { t: 30, sub: "Часть 3 (30-45с): Разрушение ловушки врагов и триумф героя в финале." }
                    ],
                    desc: `Сценарий (45с): Высокотехнологичная динамика по теме «${topic}». ${hints}.`
                },
                {
                    title: "Вариант 4: Эпическое испытание на прочность (45с)",
                    acts: [
                        { t: 0, sub: "Часть 1 (0-15с): Суровые условия и критическая угроза городу." },
                        { t: 15, sub: "Часть 2 (15-30с): Преодоление препятствий на пределе возможностей." },
                        { t: 30, sub: "Часть 3 (30-45с): Мощный финальный аккорд и спасение мира." }
                    ],
                    desc: `Сценарий (45с): Напряженное приключение на тему «${topic}». ${hints}.`
                },
                {
                    title: "Вариант 5: Кинематографичный блокбастер (45с)",
                    acts: [
                        { t: 0, sub: "Часть 1 (0-15с): Масштабные панорамы и старт погони." },
                        { t: 15, sub: "Часть 2 (15-30с): Быстрая смена локаций и акробатические трюки." },
                        { t: 30, sub: "Часть 3 (30-45с): Грандиозная развязка и яркий финал." }
                    ],
                    desc: `Сценарий (45с): Полномасштабный киноролик на тему «${topic}». ${hints}.`
                }
            ];

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = currentStoryOptions.map((opt, idx) => `
                <div class="option-card ${idx === 0 ? 'selected' : ''}" onclick="selectOption(${idx})">
                    <b>${opt.title}</b>
                    <p>${opt.desc}</p>
                </div>
            `).join('');

            document.getElementById('optionsCard').classList.remove('hidden');
            selectedOptionIndex = 0;
            document.getElementById('renderStatus').innerText = "Статус: Выберите вариант сюжета из 5 предложенных и нажмите утвердить.";
        }

        function selectOption(idx) {
            selectedOptionIndex = idx;
            document.querySelectorAll('.option-card').forEach((card, i) => {
                card.classList.toggle('selected', i === idx);
            });
        }

        function confirmSelectedStory() {
            activeVariant = currentStoryOptions[selectedOptionIndex];
            document.getElementById('renderStatus').innerText = `Статус: Сюжет утвержден («${activeVariant.title}»). Готов к показу!`;
            speakVoice(activeVariant.desc);
            drawScene(0);
        }

        function speakVoice(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.rate = 0.95;
                utterance.pitch = 0.9;
                const voices = window.speechSynthesis.getVoices();
                const ruVoice = voices.find(v => v.lang.includes('ru') && (v.name.includes('Pavel') || v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Milena')));
                if (ruVoice) utterance.voice = ruVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startPlayback() {
            if (!activeVariant) {
                generateStoryOptions();
                activeVariant = currentStoryOptions[0];
            }
            cancelAnimationFrame(animationId);
            isPlaying = true;
            startTime = performance.now();
            speakVoice(activeVariant.desc);
            document.getElementById('renderStatus').innerText = "Статус: Идет кинематографичный рендер и озвучка...";

            function loop(now) {
                const elapsed = (now - startTime) / 1000;
                if (elapsed > 45) {
                    isPlaying = false;
                    document.getElementById('renderStatus').innerText = "Статус: Воспроизведение успешно завершено!";
                    return;
                }
                document.getElementById('renderTimer').innerText = `${elapsed.toFixed(1)}с / 45.0с`;
                document.getElementById('progressBarFill').style.width = `${(elapsed / 45) * 100}%`;
                drawScene(elapsed);
                if (isPlaying) {
                    animationId = requestAnimationFrame(loop);
                }
            }
            animationId = requestAnimationFrame(loop);
        }

        function stopPlayback() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('renderStatus').innerText = "Статус: Остановлено.";
        }

        function drawScene(t) {
            // Background gradient shifting through locations over 45s
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (t < 15) {
                grad.addColorStop(0, '#030712'); grad.addColorStop(1, '#1e1b4b');
            } else if (t < 30) {
                grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#312e81');
            } else {
                grad.addColorStop(0, '#4c0519'); grad.addColorStop(1, '#18181b');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Parallax City skyline / background details
            ctx.fillStyle = '#0f172a';
            for (let i = 0; i < 6; i++) {
                let bx = (i * 140 - (t * 30) % 840 + 840) % 840 - 100;
                let bh = 300 + (i * 45) % 250;
                ctx.fillRect(bx, canvas.height - 350 - bh, 110, bh);
                // Windows
                ctx.fillStyle = '#fde047';
                ctx.fillRect(bx + 20, canvas.height - 350 - bh + 40, 16, 24);
                ctx.fillRect(bx + 70, canvas.height - 350 - bh + 40, 16, 24);
                ctx.fillStyle = '#0f172a';
            }

            // Ground / Rooftop
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, canvas.height - 350, canvas.width, 350);

            // Detailed Pro Stikman Character with kinematics
            let x = canvas.width / 2 + Math.sin(t * 2) * 180;
            let y = canvas.height - 420;

            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Head
            ctx.beginPath();
            ctx.arc(x, y - 75, 22, 0, Math.PI * 2);
            ctx.fillStyle = '#f8fafc';
            ctx.fill();
            ctx.stroke();

            // Torso
            ctx.beginPath();
            ctx.moveTo(x, y - 53);
            ctx.lineTo(x, y + 20);
            ctx.stroke();

            // Arms (Animated joints)
            let armSwing = Math.sin(t * 10) * 30;
            ctx.beginPath();
            ctx.moveTo(x, y - 35);
            ctx.lineTo(x - 35, y - 10 + armSwing);
            ctx.moveTo(x, y - 35);
            ctx.lineTo(x + 35, y - 10 - armSwing);
            ctx.stroke();

            // Legs
            let legCycle = Math.sin(t * 10) * 35;
            ctx.beginPath();
            ctx.moveTo(x, y + 20);
            ctx.lineTo(x - 22, y + 100 + legCycle);
            ctx.moveTo(x, y + 20);
            ctx.lineTo(x + 22, y + 100 - legCycle);
            ctx.stroke();

            // Determine active act based on time t
            let currentActSub = "Часть 1: Завязка и появление героя...";
            if (activeVariant && activeVariant.acts) {
                if (t >= 30) currentActSub = activeVariant.acts[2].sub;
                else if (t >= 15) currentActSub = activeVariant.acts[1].sub;
                else currentActSub = activeVariant.acts[0].sub;
            } else {
                if (t >= 30) currentActSub = "Часть 3: Кульминация и финал серии...";
                else if (t >= 15) currentActSub = "Часть 2: Погоня и динамичный поворот...";
            }

            // Cinematic Subtitles / Story Overlay
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(40, canvas.height - 200, canvas.width - 80, 120);
            ctx.strokeStyle = '#a78bfa';
            ctx.lineWidth = 2;
            ctx.strokeRect(40, canvas.height - 200, canvas.width - 80, 120);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(currentActSub, canvas.width / 2, canvas.height - 135);
            ctx.font = '16px sans-serif';
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText(activeVariant ? activeVariant.title : "Стиль: Кинематографичный мир", canvas.width / 2, canvas.height - 100);
            ctx.textAlign = 'left';
        }

        window.onload = () => {
            generateStoryOptions();
            drawScene(0);
        };
    </script>
</body>
</html>
